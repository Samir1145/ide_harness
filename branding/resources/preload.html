<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            background-color: black;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Above styles copied from https://github.com/eclipse-theia/theia/blob/5aeef6c0c683b4e91713ab736957e6655b486adc/packages/core/src/browser/style/index.css#L147-L151 */
            /* Otherwise, there is a flickering when Theia's CSS loads. */

            background-image: none;
        }

        .theia-preload::after {
            /* remove default loading animation */
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: center;
            align-self: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            align-self: center;
        }

        .custom-spinner img {
            width: 32vw;
            height: auto;
            max-width: 450px;
            animation-delay: 0;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-name: theia-ide-spinner;
            animation-timing-function: ease-in-out;
        }

        @keyframes theia-ide-spinner {
            0% {
                transform: scale(1.0);
                opacity: 0.95;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
            }
            50% {
                transform: scale(0.96);
                opacity: 0.55;
                filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.3));
            }
            100% {
                transform: scale(1.0);
                opacity: 0.95;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
            }
        }
            50% {
                transform: scale(0.96);
                opacity: 0.55;
                filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.3));
            }
            100% {
                transform: scale(1.0);
                opacity: 0.95;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
            }
        }
            50% {
                transform: scale(0.96);
                opacity: 0.65;
                filter: drop-shadow(0 0 24px rgba(6, 182, 212, 0.9)) sepia(30%) saturate(1500%) hue-rotate(145deg);
            }
            100% {
                transform: scale(1.0);
                opacity: 0.95;
                filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.7)) sepia(30%) saturate(1500%) hue-rotate(190deg);
            }
        }
            50% {
                transform: scale(0.96);
                opacity: 0.65;
                filter: drop-shadow(0 0 24px rgba(6, 182, 212, 0.9)) sepia(30%) saturate(1500%) hue-rotate(145deg);
            }
            100% {
                transform: scale(1.0);
                opacity: 0.95;
                filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.7)) sepia(30%) saturate(1500%) hue-rotate(190deg);
            }
        }
            50% {
                transform: scale(0.96);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.0);
                opacity: 0.9;
            }
        }
            50% {
                transform: scale(0.96);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.0);
                opacity: 0.9;
            }
        }
            50% {
                transform: scale(0.96);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.0);
                opacity: 0.9;
            }
        }

            50% {
                filter: invert(57%) sepia(52%) saturate(1900%) hue-rotate(160deg) brightness(100%) contrast(102%);
                transform: scale(0.8);
            }

            100% {
                filter: invert(49%) sepia(71%) saturate(5980%) hue-rotate(199deg) brightness(103%) contrast(101%);
                transform: scale(1.0);
            }
        }
    </style>
</head>
