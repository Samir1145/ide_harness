name: Build & Release Hayagriva (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: use macos-14 (Apple Silicon M1, available on free tier)
          # macos-13 Intel runners are queue-starved and sit indefinitely
          - platform: macos
            os: macos-14
            builder_args: '--mac --arm64 -c.mac.identity=null'
            artifact_name: Hayagriva-macOS
            artifact_path: frontend/applications/electron/dist/*.dmg

          - platform: windows
            os: windows-2022
            builder_args: '--win'
            artifact_name: Hayagriva-Windows
            artifact_path: frontend/applications/electron/dist/*Setup.exe

          - platform: linux
            os: ubuntu-22.04
            builder_args: '--linux'
            artifact_name: Hayagriva-Linux
            artifact_path: |
              frontend/applications/electron/dist/*.AppImage
              frontend/applications/electron/dist/*.deb

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Pin Node 22 LTS — nx@22.x native addons (FileLock) are not
      # compatible with Node 24 which is now the default on runners.
      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # Linux: install native build deps for Electron / node-gyp / RPM packaging
      - name: Install Linux System Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev build-essential libx11-dev libxkbfile-dev rpm desktop-file-utils

      # Windows: install Python setuptools (needed for node-gyp distutils)
      # windows-2022 has VS 2022 which node-gyp can reliably detect
      - name: Configure Windows Build Environment
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pip install setuptools

      - name: Install Backend Dependencies (Native Architecture)
        working-directory: backend
        run: npm install --omit=dev

      - name: Install Frontend Dependencies
        run: |
          yarn --cwd frontend install --frozen-lockfile --ignore-optional --ignore-engines
        env:
          # Suppress nx native daemon — prevents FileLock issues in CI
          NX_DAEMON: 'false'
          # Windows: explicitly tell node-gyp which VS version to use
          GYP_MSVS_VERSION: '2022'

      # Bypass lerna entirely — nx@22.x native FileLock is incompatible
      # with Node 22 runners. All extensions just run 'tsc -b' anyway.
      - name: Build Workspace & Hayagriva Extensions
        shell: bash
        run: |
          yarn --cwd frontend/theia-extensions/product build
          yarn --cwd frontend/theia-extensions/launcher build
          yarn --cwd frontend/theia-extensions/updater build
          yarn --cwd frontend/theia-extensions/hayagriva build

      - name: Build Electron Application Frontend Bundle
        run: |
          yarn --cwd frontend/applications/electron build

      - name: Rebuild Native Modules for Target Electron Platform
        run: |
          yarn --cwd frontend/applications/electron rebuild

      - name: Package Standalone Installer with Electron-Builder
        run: |
          yarn --cwd frontend/applications/electron electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts Structure
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
